<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Catálogo de iniciativas — Innovation Hub</title>
</head>

<body>

    <!-- ACTIVIDAD 2: header con la marca y la navegación -->
    <header>
        <a href="../index.html">Innovation Hub</a>

        <nav aria-label="Principal">
            <ul>
                <li><a href="catalogo.html" aria-current="page">Catálogo</a></li>
                <li><a href="publicar.html">Publicar iniciativa</a></li>
                <li><a href="proyectos.html">Proyectos</a></li>
                <li><a href="perfil.html">Mi perfil</a></li>
                <li><a href="solicitudes.html">Mis solicitudes</a></li>
            </ul>
        </nav>
    </header>

    <!-- ACTIVIDAD 3: main con h1 -->
    <main>
        <h1>Catálogo de iniciativas</h1>

        <!-- ACTIVIDAD 4: aside -->
        <aside aria-labelledby="titulo-filtros">
            <h2 id="titulo-filtros">Filtrar iniciativas</h2>

            <form>
                <p>
                    <label for="filtro-tipo">Tipo</label>
                    <select id="filtro-tipo" name="tipo">
                        <option value="">Todos</option>
                        <option value="idea">Idea</option>
                        <option value="necesidad">Necesidad</option>
                        <option value="reto">Reto</option>
                    </select>
                </p>

                <p>
                    <label for="filtro-categoria">Categoría</label>
                    <select id="filtro-categoria" name="categoria">
                        <option value="">Todas</option>
                        <option value="educacion">Educación</option>
                        <option value="ambiente">Ambiente</option>
                        <option value="comunidad">Gestión comunitaria</option>
                    </select>
                </p>

                <p>
                    <label for="filtro-competencia">Competencia requerida</label>
                    <input type="text" id="filtro-competencia" name="competencia">
                </p>

                <p><button type="submit">Aplicar filtros</button></p>
            </form>
        </aside>

        <!-- ACTIVIDAD 5: section -->
    </main>

    <!-- ACTIVIDAD 6: footer -->

</body>

</html>
