<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Catálogo de iniciativas — Innovation Hub</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&family=Poppins:wght@600;700&display=swap" rel="stylesheet">

    <link href="../css/main.css" rel="stylesheet">
</head>

<body>

    <!-- ACTIVIDAD 2: header con la marca y la navegación -->
    <header class="site-header">
        <nav class="navbar navbar-expand-lg" data-bs-theme="dark" aria-label="Principal">
            <div class="container">
                <a class="navbar-brand" href="../index.html">Innovation Hub</a>

                <button class="navbar-toggler" type="button" data-bs-toggle="collapse"
                    data-bs-target="#menu-principal" aria-controls="menu-principal"
                    aria-expanded="false" aria-label="Abrir menú de navegación">
                    <span class="navbar-toggler-icon"></span>
                </button>

                <div class="collapse navbar-collapse" id="menu-principal">
                    <ul class="navbar-nav ms-auto">
                        <li class="nav-item"><a class="nav-link" href="../index.html">Inicio</a></li>
                        <li class="nav-item"><a class="nav-link active" aria-current="page" href="catalogo.html">Catálogo</a></li>
                        <li class="nav-item"><a class="nav-link" href="publicar-iniciativa.html">Publicar iniciativa</a></li>
                        <li class="nav-item"><a class="nav-link" href="perfil-usuario.html">Mi perfil</a></li>
                    </ul>
                </div>
            </div>
        </nav>
    </header>

    <!-- ACTIVIDAD 3: main con h1 -->
    <main class="container py-4">
        <h1>Catálogo de iniciativas</h1>


        <section aria-labelledby="titulo-busqueda" class="mb-4">
            <h2 id="titulo-busqueda">Buscar iniciativas</h2>

            <label for="buscador" class="form-label">
                Título, resumen o etiqueta
            </label>

            <input type="search" id="buscador" class="form-control" placeholder="Ej. tutorías">
        </section>

        <!-- ACTIVIDAD 4: aside -->
        <div class="row g-4">
            <aside class="col-12 col-lg-3" aria-labelledby="titulo-filtros">
                <h2 id="titulo-filtros">Filtrar iniciativas</h2>

                <form id="form-filtros">
                    <div class="mb-3">
                        <label for="filtro-tipo" class="form-label">Tipo</label>
                        <select id="filtro-tipo" name="tipo" class="form-select">
                            <option value="">Todos</option>
                            <option value="Idea">Idea</option>
                            <option value="Necesidad">Necesidad</option>
                            <option value="Reto">Reto</option>
                        </select>
                    </div>

                    <div class="mb-3">
                        <label for="filtro-categoria" class="form-label">Categoría</label>
                        <select id="filtro-categoria" name="categoria" class="form-select">
                            <option value="">Todas</option>
                            <option value="Tecnología">Tecnología</option>
                            <option value="Educación">Educación</option>
                            <option value="Sostenibilidad">Sostenibilidad</option>
                            <option value="Impacto Social">Impacto Social</option>
                            <option value="Negocios y Emprendimiento">Negocios y Emprendimiento</option>
                            <option value="Salud y Bienestar">Salud y Bienestar</option>
                            <option value="Cultura y Creatividad">Cultura y Creatividad</option>
                            <option value="Otro">Otro</option>
                        </select>
                    </div>

                    <div class="mb-3">
                        <label for="filtro-competencia" class="form-label">Competencia requerida</label>
                        <select id="filtro-competencia" name="competencia" class="form-select">
                            <option value="">Todas</option>
                            <option value="Java">Java</option>
                            <option value="JavaScript">JavaScript</option>
                            <option value="HTML">HTML</option>
                            <option value="CSS">CSS</option>
                            <option value="Desarrollo Web">Desarrollo Web</option>
                            <option value="Bases de datos">Bases de datos</option>
                            <option value="Programación">Programación</option>
                            <option value="Diseño UX/UI">Diseño UX/UI</option>
                            <option value="Comunicación">Comunicación</option>
                            <option value="Trabajo en equipo">Trabajo en equipo</option>
                            <option value="Investigación">Investigación</option>
                            <option value="Análisis de datos">Análisis de datos</option>
                            <option value="Marketing">Marketing</option>
                            <option value="Electrónica">Electrónica</option>
                            <option value="Internet de las Cosas">Internet de las Cosas</option>
                            <option value="Sostenibilidad">Sostenibilidad</option>
                        </select>
                    </div>

                    <p><button type="submit" class="btn btn-primary">Aplicar filtros</button></p>
                    <button type="button" id="btn-limpiar" class="btn btn-secondary">
                        Limpiar filtros
                    </button>
                </form>
            </aside>


            <!-- ACTIVIDAD 5: section -->
            <section class="col-12 col-lg-9" aria-labelledby="titulo-resultados">
                <h2 id="titulo-resultados">8 iniciativas encontradas</h2>

                <div id="contenedor-iniciativas" class="row g-4">

                </div>
            </section>

        </div>
    </main>

    <!-- ACTIVIDAD 6: footer -->
    <footer class="site-footer">
        <div class="container">
            <div class="row gy-2">
                <div class="col-md-6">
                    <p class="fw-semibold mb-1">Innovation Hub</p>
                    <p class="mb-0">Universidad CENFOTEC · SOFT-12</p>
                </div>
                <div class="col-md-6 text-md-end">
                    <p class="mb-0">Contacto: <a href="mailto:hub@ejemplo.ac.cr">hub@ejemplo.ac.cr</a></p>
                </div>
            </div>
        </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../js/catalogo.js"></script>
</body>

</html>
